name: Verify methods
on:
  push:
    paths:
      - 'methods/**'
      - '.github/workflows/methods.yml'
  pull_request:
    paths:
      - 'methods/**'
      - '.github/workflows/methods.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: methods
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make check
