name: Verify analysis
on:
  push:
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run python scripts/demo.py /tmp/nga-demo
