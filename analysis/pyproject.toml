[project]
name = "naruto-germany-analysis"
version = "0.1.0"
description = "Which Naruto characters could sell best in Germany: the reproducible analysis pipeline behind the dashboard"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "archive: needs the read-only data archive on disk",
]
