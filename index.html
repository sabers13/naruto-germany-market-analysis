<title>Naruto × Germany — Saber Sojudi</title>
<script>try{const t=new URLSearchParams(location.search).get("theme")||"light";if(t)document.documentElement.dataset.theme=t;const l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("naruto-lang");if(l==="en"||l==="de")document.documentElement.lang=l}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (pill-dashboard, accent = Konoha orange; DESIGN.md §3) ===== */
:root{
  --bg-page:#E7E7EA;--bg-shell:#F2F2F4;--bg-card:#FFFFFF;--bg-inset:#F4F4F6;--bg-inset-hover:#ECECEF;--bg-chip:#EDEDF0;
  --ink:#121214;--ink-2:#3A3A40;--ink-muted:#63636C;--ink-faint:#9A9AA3;--on-ink:#FFFFFF;--hairline:#EAEAEE;
  --accent:#C2410C;--on-accent:#FFFFFF;
  --accent-strong:color-mix(in oklab,var(--accent) 82%,black);--accent-light:color-mix(in oklab,var(--accent) 78%,white);
  --accent-soft:color-mix(in oklab,var(--accent) 10%,white);--accent-ring:color-mix(in oklab,var(--accent) 40%,white);
  --accent-gradient:radial-gradient(120% 90% at 78% 22%,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%),linear-gradient(135deg,var(--accent-light) 0%,var(--accent) 45%,var(--accent-strong) 100%);
  --on-accent-ink:#121214;--on-accent-muted:color-mix(in oklab,var(--on-accent) 84%,transparent);--on-accent-glass:color-mix(in oklab,var(--on-accent) 20%,transparent);
  --success:#1F7A45;--success-soft:#DFF5E7;--danger:#C4242A;--danger-soft:#FDE8E8;--warn:#92400E;--warn-soft:#FFF4E0;
  --hatch-color:#D9D9DE;--hatch:repeating-linear-gradient(-45deg,var(--hatch-color) 0 1.5px,transparent 1.5px 6px);
  --hatch-accent:repeating-linear-gradient(-45deg,color-mix(in oklab,var(--on-accent) 55%,transparent) 0 1.5px,transparent 1.5px 5px);
  --r-shell:32px;--r-card:24px;--r-inset:16px;--r-tile:14px;--r-pill:999px;
  --shell-margin:24px;--shell-pad:28px;--gap:20px;--gap-inner:12px;--card-pad:20px;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-inout:cubic-bezier(.65,0,.35,1);--dur-fast:160ms;--dur:320ms;--dur-enter:520ms;--stagger:60ms;
  --ring:var(--ink);color-scheme:light}
:root[data-theme="dark"]{--bg-page:#0B0B0D;--bg-shell:#111113;--bg-card:#18181B;--bg-inset:#1E1E22;--bg-inset-hover:#26262B;--bg-chip:#222227;--ink:#F4F4F6;--ink-2:#D4D4DA;--ink-muted:#9A9AA4;--ink-faint:#6A6A73;--on-ink:#121214;--hairline:#26262B;--accent-soft:color-mix(in oklab,var(--accent) 18%,transparent);--accent-ring:color-mix(in oklab,var(--accent) 45%,transparent);--success:#4CC384;--success-soft:rgba(31,157,85,.16);--danger:#F07075;--danger-soft:rgba(229,72,77,.16);--warn:#F0B35A;--warn-soft:rgba(234,160,40,.14);--hatch-color:#34343B;--ring:#F4F4F6;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg-page:#0B0B0D;--bg-shell:#111113;--bg-card:#18181B;--bg-inset:#1E1E22;--bg-inset-hover:#26262B;--bg-chip:#222227;--ink:#F4F4F6;--ink-2:#D4D4DA;--ink-muted:#9A9AA4;--ink-faint:#6A6A73;--on-ink:#121214;--hairline:#26262B;--accent-soft:color-mix(in oklab,var(--accent) 18%,transparent);--accent-ring:color-mix(in oklab,var(--accent) 45%,transparent);--success:#4CC384;--success-soft:rgba(31,157,85,.16);--danger:#F07075;--danger-soft:rgba(229,72,77,.16);--warn:#F0B35A;--warn-soft:rgba(234,160,40,.14);--hatch-color:#34343B;--ring:#F4F4F6;color-scheme:dark}}
@media (prefers-reduced-motion:reduce){:root{--dur-fast:0ms;--dur:0ms;--dur-enter:1ms;--stagger:0ms}}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg-page)}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--ink-2);font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr td{text-align:right}.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
button{font:inherit}
a{color:inherit}

/* ===== Shell ===== */
.shell{margin:var(--shell-margin) auto;padding:var(--shell-pad);background:var(--bg-shell);border-radius:var(--r-shell);width:min(1440px,100% - 2*var(--shell-margin));min-height:calc(100vh - 2*var(--shell-margin))}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.topbar .right{display:flex;gap:12px;justify-content:flex-end}
.pill{background:var(--bg-card);border-radius:var(--r-pill);height:52px;display:flex;align-items:center}
.logo{padding:8px 18px 8px 8px;gap:10px;width:max-content;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none}
.mark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-gradient);color:var(--on-accent);font-weight:700;font-size:13px}
.nav{position:relative;padding:4px;gap:2px}
.nav a{position:relative;z-index:1;padding:9px 16px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:color var(--dur) var(--ease-out)}
.nav a[aria-current="page"]{color:var(--on-ink);background:var(--ink);transition:color var(--dur) var(--ease-out),background 0s linear var(--dur)}
.nav-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:var(--r-pill);background:var(--ink);transition:transform var(--dur) var(--ease-out),width var(--dur) var(--ease-out)}
.actions{padding:4px 6px;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:background var(--dur-fast)}
.icon-btn:hover{background:var(--bg-inset)}
.icon-btn svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--bg-chip);border-radius:var(--r-pill);padding:3px;gap:2px;flex-wrap:nowrap}
.seg button{border:0;background:transparent;font:500 12.5px var(--font);color:var(--ink-muted);padding:6px 12px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bg-card);color:var(--ink);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--bg-inset-hover)}
.project{padding:0 18px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.body{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:24px;margin-top:28px}
.rail{display:flex;flex-direction:column;justify-content:space-between;position:sticky;top:28px;height:calc(100vh - 160px);min-height:520px}
.rail .group{background:var(--bg-card);border-radius:var(--r-pill);padding:4px;display:flex;flex-direction:column;gap:4px}
.rail .icon-btn[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.rail .icon-btn[aria-pressed="true"]{background:var(--bg-inset)}

/* ===== Header ===== */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}
h1{font-size:40px;line-height:1.08;font-weight:600;letter-spacing:-.03em;color:var(--ink);margin:0;max-width:26ch;text-wrap:balance}
.sub{color:var(--ink-muted);margin:10px 0 0;max-width:72ch;font-size:15px;line-height:1.5}
.notice{display:inline-flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-pill);padding:8px 14px;font-size:12.5px;font-weight:500;white-space:nowrap}
.notice.tag{background:var(--accent-soft);color:var(--accent-strong)}
:root[data-theme="dark"] .notice.tag{color:var(--ink)}

/* ===== Grid & cards ===== */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
.card{background:var(--bg-card);border-radius:var(--r-card);padding:var(--card-pad);min-width:0}
:root[data-theme="dark"] .card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px;margin-bottom:4px}.card-h .seg{max-width:100%;overflow-x:auto}
.card-h h2{font-size:18px;font-weight:600;color:var(--ink);margin:0;line-height:1.3}
.card-sub{color:var(--ink-muted);font-size:12.5px;margin:4px 0 14px;line-height:1.45}
.muted{color:var(--ink-muted);font-size:12.5px}
.inset{background:var(--bg-inset);border-radius:var(--r-inset);padding:14px}
.stack{display:grid;gap:var(--gap);align-content:start}

/* ===== KPI tiles ===== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-inner);padding:12px;height:100%}
.tile{background:var(--bg-inset);border-radius:var(--r-inset);padding:16px;min-height:132px;display:flex;flex-direction:column;min-width:0}
.tile .lab{font-size:13px;color:var(--ink-muted);line-height:1.35}
.tile .val{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:auto 0 4px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .val small{font-size:15px;color:var(--ink-muted);font-weight:500}
.tile .cap{font-size:12px;color:var(--ink-muted);line-height:1.4}
.tile.hero{background:var(--accent-gradient);color:var(--on-accent)}
.tile.hero .lab,.tile.hero .cap,.tile.hero .val small{color:var(--on-accent-muted)}
.tile.hero .val{color:var(--on-accent)}

/* ===== Hero card ===== */
.hero-card{background:var(--accent-gradient);color:var(--on-accent);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;min-width:0}
.glass{display:inline-flex;align-self:flex-start;background:var(--on-accent-glass);color:var(--on-accent);border-radius:var(--r-pill);padding:5px 11px;font-size:12px;font-weight:600}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--on-accent-muted)}
.hero-card h2{color:var(--on-accent);font-size:18px;font-weight:600;margin:18px 0 0}
.hero-num{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:16px;font-weight:500;color:var(--on-accent-muted);margin-left:6px;letter-spacing:0}
.hero-name{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:16px 0 6px}
.hero-card p{color:var(--on-accent-muted);font-size:14px;line-height:1.5;margin:6px 0 0;max-width:42ch}
.hero-bar{height:10px;border-radius:var(--r-pill);background:var(--hatch-accent);overflow:hidden;margin:18px 0 8px}
.hero-bar i{display:block;height:100%;width:0;background:var(--on-accent);border-radius:inherit;transition:width 800ms var(--ease-out) 200ms}
.hero-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--on-accent-muted)}
.hero-list{list-style:none;margin:16px 0 0;padding:0;display:grid}
.hero-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-size:13.5px;box-shadow:inset 0 1px 0 var(--on-accent-glass)}
.hero-list b{font-variant-numeric:tabular-nums}

/* ===== Buttons & chips ===== */
.btn{height:44px;padding:0 20px;border-radius:var(--r-pill);border:0;cursor:pointer;font:600 14px var(--font);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform 120ms,background var(--dur-fast);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-secondary{background:var(--bg-inset);color:var(--ink)}
.btn-on{background:var(--on-accent);color:var(--on-accent-ink);height:40px;margin-top:18px;align-self:flex-start}
.btn-sm{height:32px;padding:0 14px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-pill);padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.up{background:var(--success-soft);color:var(--success)}.down{background:var(--danger-soft);color:var(--danger)}.flat{background:var(--bg-chip);color:var(--ink-2)}
.acc{background:var(--accent-soft);color:var(--accent-strong)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .acc,:root:not([data-theme="light"]) .notice.tag{color:var(--ink)}}
:root[data-theme="dark"] .acc{color:var(--ink)}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--gap)}
.picker button{border:0;background:var(--bg-card);color:var(--ink-2);font:500 13px var(--font);height:36px;padding:0 14px;border-radius:var(--r-pill);cursor:pointer}
.picker button:hover{background:var(--bg-inset-hover)}
.picker button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:600}

/* ===== Primary card ===== */
.big{font-size:44px;font-weight:600;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;margin:10px 0 6px;line-height:1.05}
.big small{font-size:16px;color:var(--ink-muted);font-weight:500;margin-left:6px;letter-spacing:0}
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ptile{background:var(--bg-card);border-radius:12px;padding:12px;min-width:0}
.ptile b{display:block;font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ptile span{font-size:12px;color:var(--ink-muted)}

/* ===== Progress (hatched) ===== */
.prog{margin-top:18px}
.prog .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;color:var(--ink-2)}
.prog .t b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:var(--r-pill);background:var(--hatch);overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width 800ms var(--ease-out) 200ms}
.bar.ink>i{background:var(--ink)}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-muted)}

/* ===== Charts ===== */
.plot{position:relative;background:var(--bg-inset);border-radius:var(--r-inset);padding:12px 12px 6px}
.plot svg{display:block;width:100%;overflow:visible}
.plot .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity 120ms,transform 120ms;z-index:2}
.plot .tip.on{opacity:1;transform:none}
.plot .tip b{font-weight:600}
.plot .tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-muted);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.legend .hs{width:14px;height:8px;border-radius:3px;background:var(--hatch)}
.ax{font-size:11px;fill:var(--ink-muted)}
.vl{font-size:11.5px;font-weight:600;fill:var(--ink)}
.line-path{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 900ms var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hbars{display:grid;gap:12px}
.hb .t{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-2)}
.hb .t b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .tr{height:10px;border-radius:var(--r-pill);background:var(--bg-inset);margin-top:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;width:0;border-radius:inherit;background:var(--ink);transition:width 800ms var(--ease-out) 200ms}
.hb.lead .tr i{background:var(--accent)}
.hb .tr i.hat{background:var(--hatch),var(--bg-chip)}
.share{display:flex;height:28px;border-radius:10px;overflow:hidden;gap:2px;margin:6px 0 14px}
.share div{min-width:0;transition:flex-grow 600ms var(--ease-out)}
.ltab{width:100%;border-collapse:collapse;font-size:13px}
.ltab td{padding:7px 0;border-top:1px solid var(--hairline);font-variant-numeric:tabular-nums}
.ltab td:nth-child(n+3){text-align:right;color:var(--ink)}
.ltab i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}

/* ===== Data-bar table ===== */
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:860px}
.data thead th{background:var(--bg-inset);color:var(--ink-muted);font-weight:500;font-size:12px;text-align:right;padding:11px 12px;line-height:1.3;vertical-align:bottom}
.data thead th:first-child{border-radius:12px 0 0 12px;text-align:left}.data thead th:last-child{border-radius:0 12px 12px 0}
.data thead th.l{text-align:left}
.data td{padding:11px 12px;border-bottom:1px solid var(--hairline);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);vertical-align:middle}
.data td.who{text-align:left;color:var(--ink);font-weight:600;white-space:nowrap}
.data td.who span{display:block;font-weight:400;font-size:12px;color:var(--ink-muted)}
.data tr:last-child td{border-bottom:0}
.data .db{display:block;height:4px;border-radius:2px;background:var(--bg-chip);margin-top:6px;overflow:hidden}
.data .db i{display:block;height:100%;background:var(--ink-faint);border-radius:inherit;margin-left:auto}
.data td.lead{color:var(--ink);font-weight:600}
.data td.lead .db i{background:var(--accent)}
.data tr.bench td{background:var(--bg-inset);color:var(--ink-muted)}
.data tr.bench td:first-child{border-radius:12px 0 0 12px}.data tr.bench td:last-child{border-radius:0 12px 12px 0}
.data td.na{color:var(--ink-faint)}
.idx{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.idx .m{width:64px;height:8px;border-radius:999px;background:var(--hatch);overflow:hidden}
.idx .m i{display:block;height:100%;background:var(--ink);border-radius:inherit}
.idx.top .m i{background:var(--accent)}

/* ===== Tile map ===== */
.tmap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:520px;margin:0 auto}
.st{aspect-ratio:1.25;border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg-inset);color:var(--ink);min-width:0;border:0;font:inherit;text-align:left;cursor:default}
.st b{font-size:13px;font-weight:600}
.st span{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.st.s1{background:color-mix(in oklab,var(--accent) 12%,var(--bg-card))}
.st.s2{background:color-mix(in oklab,var(--accent) 28%,var(--bg-card))}
.st.s3{background:color-mix(in oklab,var(--accent) 48%,var(--bg-card))}
.st.s4{background:color-mix(in oklab,var(--accent) 72%,var(--bg-card));color:var(--on-accent)}
.st.s5{background:var(--accent);color:var(--on-accent)}
.st.sup{background:var(--hatch),var(--bg-inset);color:var(--ink-muted)}
.scale{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);margin-top:14px;justify-content:center}
.scale i{width:22px;height:10px;border-radius:3px;display:inline-block}

/* ===== Lists, timelines, matrix ===== */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--hairline)}
.rows li:first-child{border-top:0}
.rows b{color:var(--ink);font-weight:600}
.rows span{grid-column:1/-1;font-size:12.5px;color:var(--ink-muted);line-height:1.45}

function monotone(pts){ // Fritsch–Carlson monotone cubic → SVG path
  const n=pts.length; if(n<2) return "";
  const dx=[],dy=[],m=[],tg=[];
  for(let i=0;i<n-1;i++){dx[i]=pts[i+1][0]-pts[i][0];dy[i]=pts[i+1][1]-pts[i][1];m[i]=dy[i]/dx[i]}
  tg[0]=m[0];tg[n-1]=m[n-2];
  for(let i=1;i<n-1;i++){tg[i]=m[i-1]*m[i]<=0?0:3*(dx[i-1]+dx[i])/((2*dx[i]+dx[i-1])/m[i-1]+(dx[i]+2*dx[i-1])/m[i])}
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${pts[i][0]+h},${pts[i][1]+tg[i]*h} ${pts[i+1][0]-h},${pts[i+1][1]-tg[i+1]*h} ${pts[i+1][0]},${pts[i+1][1]}`}
  return d;
}
function niceMax(v){const s=[1,2,2.5,5,10];const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of s){if(k*p>=v*1.05)return k*p}return 10*p}
function areaChart(host,{labels,series,height=240,xEvery=4,yFmt=v=>fmt(v,0),tipFmt=v=>fmt(v,2),aria}){
  const W=Math.max(300,host.clientWidth-24),H=height,L=34,R=8,T=10,B=26;
  const raw=Math.max(...series.flatMap(s=>s.values))/4,p10=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].map(k=>k*p10).find(k=>k*4>=raw*4*1.04),max=step*4,dec=step<1?1:0;
  const x=i=>L+(W-L-R)*i/(labels.length-1),y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,.25,.5,.75,1].map(f=>f*max);
  let g=`<defs>${series.map((s,i)=>`<linearGradient id="g${host.id}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join("")}</defs>`;
  g+=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--hairline);stroke-width:1" ${v?'stroke-dasharray="3 4"':''}/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmt(v,dec)}</text>`).join("");
  g+=labels.map((l,i)=>i%xEvery===0||i===labels.length-1?`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===labels.length-1?"end":"middle"}">${l}</text>`:"").join("");
  series.slice().reverse().forEach((s,ri)=>{const i=series.length-1-ri;const pts=s.values.map((v,j)=>[x(j),y(v)]);const d=monotone(pts);
    g+=`<path d="${d}L${x(s.values.length-1)},${y(0)}L${x(0)},${y(0)}Z" fill="url(#g${host.id}${i})"/>`;
    g+=`<path class="line-path draw" d="${d}" style="stroke:${s.color};--len:${W*2}"/>`;});
  g+=`<line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" style="stroke:var(--ink-faint);stroke-width:1;opacity:0" stroke-dasharray="3 3"/>`;
  g+=series.map((s,i)=>`<circle class="hd" data-i="${i}" r="4.5" cx="0" cy="0" style="fill:${s.color};stroke:var(--bg-card);stroke-width:2;opacity:0"/>`).join("");
  const table=`<div class="sr"><table><caption>${esc(aria)}</caption><tr><th></th>${labels.map(l=>`<th>${l}</th>`).join("")}</tr>${series.map(s=>`<tr><th>${esc(s.name)}</th>${s.values.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table></div>`;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(aria)}">${g}</svg><div class="tip"></div>${table}`;
  const svg=host.querySelector("svg"),tip=host.querySelector(".tip"),cross=svg.querySelector(".cross"),dots=svg.querySelectorAll(".hd");
  const move=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*W/r.width;let i=Math.round((px-L)/(W-L-R)*(labels.length-1));i=Math.max(0,Math.min(labels.length-1,i));
    cross.setAttribute("x1",x(i));cross.setAttribute("x2",x(i));cross.style.opacity=1;
    dots.forEach(d=>{const s=series[d.dataset.i];d.setAttribute("cx",x(i));d.setAttribute("cy",y(s.values[i]));d.style.opacity=1});
    tip.innerHTML=`<b>${labels[i]}</b><br>`+series.map(s=>`<i style="background:${s.color}"></i>${esc(s.name)} ${tipFmt(s.values[i])}`).join("<br>");
    const left=x(i)*r.width/W+12;tip.style.left=Math.min(left+12,r.width-tip.offsetWidth)+"px";tip.style.top="14px";tip.classList.add("on")};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerleave",()=>{tip.classList.remove("on");cross.style.opacity=0;dots.forEach(d=>d.style.opacity=0)});
}
function barChart(host,{items,height=200,aria}){
  const W=Math.max(260,host.clientWidth-24),H=height,T=22,B=24,n=items.length,slot=(W-8)/n,bw=Math.min(28,slot*.5);
  const max=niceMax(Math.max(...items.map(d=>d.v)));
  const y=v=>T+(H-T-B)*(1-v/max);
  let g=`<defs><pattern id="hp${host.id}" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" style="fill:var(--accent)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--on-accent);stroke-opacity:.5;stroke-width:2"/></pattern></defs>`;
  g+=[.5,1].map(f=>`<line x1="0" x2="${W}" y1="${y(f*max)}" y2="${y(f*max)}" style="stroke:var(--hairline)" stroke-dasharray="3 4"/>`).join("");
  items.forEach((d,i)=>{const cx=4+slot*i+slot/2,h=H-B-y(d.v);
    g+=`<rect x="${cx-bw/2}" y="${y(d.v)}" width="${bw}" height="${Math.max(h,2)}" rx="6" style="fill:${d.lead?`url(#hp${host.id})`:"var(--ink)"}"><animate attributeName="height" from="0" to="${Math.max(h,2)}" dur="${reduce?"0.01s":".8s"}" fill="freeze"/><animate attributeName="y" from="${H-B}" to="${y(d.v)}" dur="${reduce?"0.01s":".8s"}" fill="freeze"/></rect>`;
    g+=`<text class="vl" x="${cx}" y="${y(d.v)-6}" text-anchor="middle">${fmt(d.v)}</text><text class="ax" x="${cx}" y="${H-6}" text-anchor="middle">${esc(d.l)}</text>`;});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(aria)}">${g}</svg><div class="sr"><table><caption>${esc(aria)}</caption>${items.map(d=>`<tr><th>${esc(d.l)}</th><td>${d.v}</td></tr>`).join("")}</table></div>`;
}

     <div class="hero-top"><span class="glass">${t("mo.heroLab")}</span><span>Google · DE</span></div>
     <div class="hero-name">${esc(lead.n)}</div>
     <div class="hero-num">${sign(lead.c)}<span data-count="${Math.abs(Math.round(lead.c))}">0</span><small>%</small></div>
     <p>${t("mo.heroP")}</p>
     <ul class="hero-list" aria-label="${esc(t("mo.changes"))}">${list.filter(x=>x!==lead).map(x=>`<li><span>${esc(x.n)}${x.f==="ambiguous_name"?` · * ${t("mo.ambShort")}`:x.f==="censored"?" · "+(LANG==="de"?"zu gering":"too low to read"):""}</span><b>${x.f==="censored"?"–":`${sign(x.c)}${Math.abs(Math.round(x.c))} %`}</b></li>`).join("")}</ul>
   </section>
   <section class="card c12 reveal" aria-label="${esc(t("mo.evT"))}"><div class="card-h"><h2>${t("mo.evT")}</h2><span class="legend"><span><i style="background:var(--ink)"></i>Naruto / Boruto</span></span></div><p class="card-sub">${t("mo.evS")}</p>
     <div class="tl" style="--n:${D.events.length}">${D.events.map(e=>`<div class="ev ${e.owner!=="franchise"?"own":""}"><time datetime="${e.date}">${fdate(e.date)}</time><b>${esc(e["title_"+LANG])}</b><p>${esc(e["note_"+LANG])} <a href="${esc(e.source_url)}" target="_blank" rel="noopener">${t("src")}</a></p></div>`).join("")}</div>
   </section></div>`;
},
momentum_after(){
  const draw=()=>{const series=moSel.map((k,i)=>({name:byName(k).n,values:TR[k],color:css(SERIES_COL[i].slice(4,-1))}));
    areaChart(document.getElementById("motrend"),{labels:Q,series,height:280,xEvery:4,aria:t("mo.chartT")});
    document.getElementById("moleg").innerHTML=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("");};

  document.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{const k=b.dataset.mo;

    document.querySelectorAll("[data-mo]").forEach(x=>x.setAttribute("aria-pressed",String(moSel.includes(x.dataset.mo))));draw()});
},

/* ===================== Router, motion, theme, language ===================== */
const view=document.getElementById("view"),nav=document.getElementById("nav");
const route=()=>{const h=(location.hash||"#overview").slice(1);return screens[h]?h:(h==="all"?"overview":"overview")};
function countUp(el){const to=+el.dataset.count;const f=v=>fmt(Math.round(v));if(reduce)return el.textContent=f(to);const t0=performance.now(),d=900,e=x=>1-Math.pow(1-x,3);
  (function s(n){const p=Math.min(1,(n-t0)/d);el.textContent=f(to*e(p));if(p<1)requestAnimationFrame(s)})(t0)}
function placeInd(){const a=nav.querySelector('[aria-current="page"]');const ind=nav.querySelector(".nav-ind");if(!a)return;ind.style.width=a.offsetWidth+"px";ind.style.transform=`translate(${a.offsetLeft}px,${a.offsetTop+a.offsetHeight-nav.clientHeight}px)`}
function render(keepScroll){
  const r=route();
  document.querySelectorAll("[data-r]").forEach(a=>a.dataset.r===r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  placeInd();
  view.innerHTML=screens[r]();
  view.querySelectorAll(".reveal").forEach((el,i)=>el.style.setProperty("--i",i));
  screens[r+"_after"]?.();
  view.querySelectorAll("[data-count]").forEach(countUp);
  requestAnimationFrame(()=>view.querySelectorAll("[data-w]").forEach(i=>i.style.width=i.dataset.w+"%"));
  document.title=t("nav."+r)+" · Naruto × Germany — Saber Sojudi";
  window.decoratePreview?.();
  if(!keepScroll){scrollTo({top:0});if(location.hash==="#all")document.getElementById("all")?.scrollIntoView()}
}
function applyLang(){document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-label]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nLabel)));
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
  requestAnimationFrame(placeInd)}
document.querySelectorAll("#lang button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang;try{localStorage.setItem("naruto-lang",LANG)}catch{}const languageURL=new URL(location.href);languageURL.searchParams.set("lang",LANG);history.replaceState(null,"",languageURL);applyLang();render(true)}));
addEventListener("hashchange",()=>render(false));
let rt;addEventListener("resize",()=>{placeInd();clearTimeout(rt);rt=setTimeout(()=>screens[route()+"_after"]?.(),150)});
document.fonts?.ready.then(placeInd);
const root=document.documentElement;
const curTheme=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
const syncTheme=()=>document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===curTheme())));
document.querySelectorAll("[data-theme-set]").forEach(btn=>btn.addEventListener("click",e=>{const next=btn.dataset.themeSet;if(next===curTheme())return;
  const apply=()=>{root.dataset.theme=next;try{localStorage.setItem("preview-theme",next)}catch{}syncTheme();screens[route()+"_after"]?.()};
  if(!document.startViewTransition||reduce)return apply();
  const x=e.clientX,y=e.clientY,rr=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${rr}px at ${x}px ${y}px)`]},{duration:600,easing:"cubic-bezier(.65,0,.35,1)",pseudoElement:"::view-transition-new(root)"}))}));
syncTheme();applyLang();render(false);
</script>
